[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-annotation-tool"
version = "1.0.0"
description = "Outil d'annotation et de traitement d'images pour le plateau mécatronique"
authors = [
    { name = "Arnauld BIGANZOLI", email = "arnauld.biganzoli@utoulouse.fr" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "PyQt6>=6.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
image-annotation-tool = "iat.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"iat.resources.icons" = ["*.ico", "*.icns", "*.png", "*.svg"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src/iat"]
branch = true
