# ===================================================================
#  File Name: .github/workflows/build.yml
#  Description: Workflow GitHub Actions d'Image Annotation Tool (IAT) :
#               tests -> construction des exécutables -> publication.
#               Adapté de .gitlab-ci.yml.
#  Developer: ArnauldDev
#  Created Date: 2026-09-29
#  Last Modified: 2026-09-29
# ===================================================================
#
# Résumé :
#   - test    : pytest sous Linux (Qt en mode « offscreen »), à chaque push
#               sur main/dev, chaque pull request et chaque étiquette ;
#   - build   : exécutables PyInstaller pour Linux, Windows et macOS, sur les
#               runners hébergés par GitHub (PyInstaller ne fait pas de
#               compilation croisée). Automatique sur une étiquette vX.Y.Z,
#               manuel sinon (onglet Actions > « Run workflow »).
#               Les tests n'y sont PAS bloquants : les exécutables sont
#               construits même si pytest échoue (voir la condition « if »
#               du job build pour rétablir le mode strict) ;
#   - release : crée la Release GitHub et y attache les exécutables,
#               uniquement sur une étiquette vX.Y.Z.
#
# Publier la version 1.0.0 avec un tag léger:
#   git tag v1.0.0
#   git push origin v1.0.0
# Et créer une release GitHub associée à ce tag :
#   gh release create v1.0.0 --title "Version 1.0.0" --notes "Description des changements"
#
# Remarque :
#   - Les tags légers sont des références Git simples, sans métadonnées supplémentaires.
#   - Les releases GitHub peuvent être créées à partir de tags légers ou annotés.
#
#  Voici la version avec un tag annoté :
#   git tag -a v1.0.0 -m "Version 1.0.0"
#   git push origin v1.0.0
# Et créer une release GitHub associée à ce tag annoté :
#   gh release create v1.0.0 --title "Version 1.0.0" --notes "Description des changements"

name: Build Multiplateforme

on:
  push:
    branches: [main, dev]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Ne pas lancer les tests (construire seulement les exécutables)"
        type: boolean
        default: true

# Annule l'exécution précédente d'une même branche si un nouveau push arrive
# (sauf pour les étiquettes, afin de ne jamais interrompre une publication).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.14"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# Droits minimaux par défaut ; le job « release » demande « contents: write ».
permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------
  # Étape « test »
  # -----------------------------------------------------------------
  test:
    name: Tests (Linux)
    # Ignoré lors d'un lancement manuel avec « skip_tests » coché.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    runs-on: ubuntu-22.04
    env:
      # Qt dessine en mémoire, sans serveur d'affichage.
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances système (Qt 6)
        run: |
          sudo apt-get update -qq
          # libgl1/libegl1 : OpenGL ; libxkbcommon0 : clavier ; libdbus-1-3,
          # libfontconfig1 : dépendances de QtGui ; libglib2.0-0 : boucle
          # d'événements ; fonts-dejavu-core : une police pour que le texte
          # ne s'affiche pas en carrés en mode offscreen.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 \
            fonts-dejavu-core

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # - name: Lancer pytest
      #   # run: python -m pytest -q --junitxml=report.xml
      #   run: python -m pytest -q -rf --tb=short --junitxml=report.xml

      # - name: Sauvegarder le rapport de tests
      #   if: always()
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: rapport-tests
      #     path: report.xml
      #     retention-days: 7

  # -----------------------------------------------------------------
  # Étape « build »
  # -----------------------------------------------------------------
  build:
    name: Compilation ${{ matrix.name }}
    # needs: test
    # Automatique sur une étiquette de version, manuel (workflow_dispatch) sinon.
    if: ${{ (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Le binaire Linux dépend de la glibc du runner : ubuntu-22.04
          # (plutôt que « latest ») le rend utilisable sur davantage de
          # distributions.
          - name: Linux
            os: ubuntu-22.04
          - name: Windows
            os: windows-latest
          # macos-latest = Mac Apple Silicon (arm64).
          - name: macOS (Apple Silicon)
            os: macos-latest
          # Pour un binaire Intel, ajouter une entrée avec « os: macos-15-intel ».
          - name: macOS Intel
            os: macos-15-intel

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installer les dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          # binutils : PyInstaller utilise objdump pour analyser les bibliothèques.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0 \
            fonts-dejavu-core binutils

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Construire l'exécutable
        run: python build_exe.py

      # --- Linux : archive .tar.gz (un artefact GitHub perd le bit exécutable)
      - name: Empaqueter (Linux)
        if: runner.os == 'Linux'
        run: |
          mv dist/ImageAnnotationTool dist/ImageAnnotationTool-linux-x86_64
          chmod +x dist/ImageAnnotationTool-linux-x86_64
          tar -czf dist/ImageAnnotationTool-linux-x86_64.tar.gz \
            -C dist ImageAnnotationTool-linux-x86_64

      # --- Windows : simple renommage de l'.exe
      - name: Empaqueter (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Rename-Item dist\ImageAnnotationTool.exe ImageAnnotationTool-windows.exe

      # --- macOS : archive .zip (signature / notarisation facultatives :
      #     voir docs/generation-executable.md)
      - name: Empaqueter (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --keepParent dist/ImageAnnotationTool \
            "dist/ImageAnnotationTool-macos-$(uname -m).zip"

      - name: Sauvegarder l'exécutable
        uses: actions/upload-artifact@v4
        with:
          name: ImageAnnotationTool-${{ matrix.name }}
          # Un seul motif par système, les autres ne correspondent à rien.
          path: |
            dist/ImageAnnotationTool-linux-x86_64.tar.gz
            dist/ImageAnnotationTool-windows.exe
            dist/ImageAnnotationTool-macos-*.zip
          if-no-files-found: error
          retention-days: 365

  # -----------------------------------------------------------------
  # Étape « release »
  # -----------------------------------------------------------------
  # Crée la Release GitHub associée à l'étiquette et y attache les trois
  # exécutables.
  release:
    name: Publication de la Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Télécharger les exécutables
        uses: actions/download-artifact@v4
        with:
          pattern: ImageAnnotationTool-*
          path: release
          merge-multiple: true

      - name: Lister les fichiers
        run: ls -lh release

      - name: Créer la Release
        uses: softprops/action-gh-release@v2
        with:
          name: Image Annotation Tool ${{ github.ref_name }}
          body: |
            Version ${{ github.ref_name }} d'Image Annotation Tool.
            Exécutables Windows, macOS et Linux ci-dessous.
          generate_release_notes: true
          files: |
            release/ImageAnnotationTool-windows.exe
            release/ImageAnnotationTool-macos-*.zip
            release/ImageAnnotationTool-linux-x86_64.tar.gz
          fail_on_unmatched_files: true
